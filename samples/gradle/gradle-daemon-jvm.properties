# Run the Gradle daemon on JDK 17, the floor of everything this build produces and runs (the desktop
# jvm() targets and runtime jars; Android stays at 11). The daemon JVM is resolved before any settings
# plugin loads, so a JDK 17 must be discoverable (auto-detected, JAVA_HOME, or
# org.gradle.java.installations.paths in gradle.properties).
toolchainVersion=17
