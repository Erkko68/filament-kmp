[versions]
agp = "9.0.1"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"
# Android bytecode level — the conventional Android target; higher values break inlining
# for consumers compiling at 11 (issue #1).
android-jvmTarget = "11"
# Desktop jvm() bytecode floor — jvmMain actuals need java.lang.foreign (finalized JDK 22).
jvm-target = "22"
androidx-activity = "1.13.0"
annotations = "26.1.0"
composeMultiplatform = "1.11.1"
# androidx Compose UI version that composeMultiplatform resolves to on Android — keep in sync with
# composeMultiplatform (used only for the Android-only ui-test-manifest, which JetBrains Compose
# doesn't republish). Verify after a Compose MP bump: ./gradlew :kotlin:filament-compose:dependencies
# --configuration androidDeviceTestRuntimeClasspath | grep androidx.compose.ui:ui-android
androidx-composeUi = "1.11.2"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"
# Compose's runComposeUiTest drives Espresso.onIdle on Android; the version transitively pulled by
# compose ui-test (3.5.0) calls a hidden InputManager method removed in Android 14+, so we force a
# current Espresso that doesn't. Keep on the same release train as androidx-test-runner.
androidx-test-espresso = "3.7.0"
junit = "4.13.2"
kotlin = "2.4.10"
kotlinx-coroutines = "1.11.0"
material3 = "1.9.0"
vanniktech-publish = "0.37.0"
dokka = "2.2.0"
kover = "0.9.8"
# tar.gz extraction for the prebuilt-download tasks in build-logic (replaced the Python scripts)
commons-compress = "1.28.0"
binary-compatibility-validator = "0.18.1"

[libraries]
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
# Gradle plugin artifacts (consumed by buildSrc convention plugins)
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
compose-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
vanniktech-publish-gradlePlugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "vanniktech-publish" }
dokka-gradlePlugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
kover-gradlePlugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-composeUi" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
vanniktechPublish = { id = "com.vanniktech.gradle-maven-publish-plugin", version.ref = "vanniktech-publish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
binaryCompatibilityValidator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
