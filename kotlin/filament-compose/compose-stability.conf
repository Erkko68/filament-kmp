// Types the Compose compiler can't infer as stable but that are safe to treat as such.
// Everything here is an opaque handle to a native/GPU object: identity *is* its equality, and
// nothing a composable reads off one changes without the scene composables re-running. Leaving
// them "unstable" poisons every class that holds one (FilamentScene, GltfAsset, CameraState,
// the camera controllers…) and every composable that takes one as a parameter.
// Regenerate the evidence with: ./gradlew :kotlin:filament-compose:compileKotlinJvm -PcomposeMetrics

