name: Bug report
description: Something in filament-kmp is broken
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        If the same thing happens using Filament directly from C++/JS (rendering artifacts, shader or
        material errors, crashes inside the engine), it belongs at
        [google/filament](https://github.com/google/filament/issues). Not sure? File it here.
  - type: dropdown
    id: platforms
    attributes:
      label: Platform(s)
      multiple: true
      options: [Android, iOS, JVM/Desktop, Web/JS, All]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: filament-kmp version
      placeholder: "0.7.2"
    validations: { required: true }
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got. A minimal sample or a diff against `samples/` gets it fixed fastest.
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: Pasted as-is; no need for code fences.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, device or browser, GPU.
      placeholder: "Windows 11, Chrome 141, NVIDIA RTX 3060"
