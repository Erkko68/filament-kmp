name: Setup Filament libs
description: |
  Filament's static libraries (prebuilts/<id>/) for the given FilamentTarget ids, cached per filaVersion.
  A miss runs the prebuilts_<id> tasks: a download for release targets, a full source build (slow, once
  per filaVersion) for those upstream ships none for (wasm, windows-arm64). wasm also gets the emsdk.

inputs:
  targets:
    description: 'Space-separated FilamentTarget ids, e.g. "linux-x64" or "ios-arm64 ios-simulator-arm64"'
    required: true

runs:
  using: composite
  steps:
    - id: plan
      shell: bash
      run: |
        targets="${{ inputs.targets }}"
        echo "fila=$(sed -n 's/^filaVersion=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
        echo "emsdk=$(sed -n 's/^emsdkVersion=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
        echo "name=${targets// /-}" >> "$GITHUB_OUTPUT"
        echo "tasks=$(printf 'prebuilts_%s ' $targets)" >> "$GITHUB_OUTPUT"
        [[ " $targets " == *" wasm "* ]] && echo "wasm=true" >> "$GITHUB_OUTPUT" || echo "wasm=false" >> "$GITHUB_OUTPUT"
    # restore/save split: a source build is saved right away, even if a later step fails.
    - id: libs
      uses: actions/cache/restore@v6
      with:
        path: prebuilts
        key: filament-libs-${{ steps.plan.outputs.fila }}-${{ steps.plan.outputs.name }}-${{ hashFiles('build-logic/src/main/kotlin/buildlogic/prebuilts/**') }}
    - id: emsdk
      if: steps.plan.outputs.wasm == 'true'
      uses: actions/cache/restore@v6
      with:
        path: .emsdk
        key: emsdk-${{ steps.plan.outputs.emsdk }}-${{ runner.os }}-${{ runner.arch }}
    # Building Filament's host tools for wasm mirrors upstream's linux-prereq action (clang + libc++, ninja).
    - if: steps.plan.outputs.wasm == 'true' && steps.libs.outputs.cache-hit != 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libc++-dev libc++abi-dev ninja-build mesa-common-dev libxi-dev libxxf86vm-dev
        echo "CC=clang" >> "$GITHUB_ENV"
        echo "CXX=clang++" >> "$GITHUB_ENV"
    - if: steps.plan.outputs.wasm == 'true' && steps.libs.outputs.cache-hit != 'true' && runner.os == 'macOS'
      shell: bash
      run: brew install ninja
    - shell: bash
      run: ./gradlew ${{ steps.plan.outputs.tasks }} --no-configuration-cache
    - if: steps.libs.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: prebuilts
        key: ${{ steps.libs.outputs.cache-primary-key }}
    - if: steps.plan.outputs.wasm == 'true' && steps.emsdk.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .emsdk
        key: ${{ steps.emsdk.outputs.cache-primary-key }}
