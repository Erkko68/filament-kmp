name: status-jvm

# Per-platform badge for the README. Mirrors the conclusion of the JVM job(s) from the most recent
# CI run on main into this workflow's own conclusion, so `status-jvm.yml/badge.svg` reflects JVM
# health. A job that was intentionally skipped (check-verification on a verified merge) counts as
# passing — only a real failure/cancellation turns the badge red. See google/filament's status-*.yml.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Reflect JVM job result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs" --paginate \
                 -q '[.jobs[] | select(.name | startswith("jvm"))] | (length > 0) and all(.conclusion == "success" or .conclusion == "skipped")')
          echo "jvm ok=$ok"
          [ "$ok" = "true" ]
