name: Publish to Maven Central

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0)'
        required: true

jobs:
  # ── Build libfilament-c per desktop platform ────────────────────────────────
  # The JNI image (c/ + jni/) each :desktop:runtime-<id> jar ships. Uploaded as <id>/libfilament-c.*;
  # download-artifact + merge-multiple collapses them into c-artifacts/, passed as -PcArtifactsDir.
  build-natives:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos-arm64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-latest, target: windows-x64 }
          - { os: windows-11-arm, target: windows-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        # Temurin ships no Windows ARM64 JDK 17; Microsoft's build does.
        with: { java-version: '17', distribution: "${{ matrix.target == 'windows-arm64' && 'microsoft' || 'temurin' }}" }
      - uses: ./.github/actions/setup-gradle-cached
      - name: Install C++ deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y clang libc++-dev libc++abi-dev libgl-dev
      - uses: ./.github/actions/setup-filament-libs
        with: { targets: '${{ matrix.target }}' }
      - name: Build libfilament-c
        shell: bash
        run: ./gradlew :desktop:cmakeBuild --no-configuration-cache
      - uses: actions/upload-artifact@v7
        with:
          name: c-${{ matrix.target }}
          path: desktop/build/filament-c/
          if-no-files-found: error

  # ── Publish all modules ───────────────────────────────────────────────────────
  publish:
    needs: build-natives
    runs-on: macos-latest
    permissions:
      contents: write   # gh release create
      actions: write    # gh workflow run pages.yml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { java-version: '17', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi
      # Same target groups as ci.yml, so these restore main's caches instead of missing on a combined
      # key: wasm is a source build of about 50 minutes.
      - uses: ./.github/actions/setup-filament-libs
        with: { targets: 'ios-arm64 ios-simulator-arm64' }
      - uses: ./.github/actions/setup-filament-libs
        with: { targets: 'macos-arm64' }
      - uses: ./.github/actions/setup-filament-libs
        with: { targets: 'wasm' }
      - uses: ./.github/actions/setup-filament-libs
        with: { targets: 'android-arm64-v8a android-armeabi-v7a android-x86_64 android-x86' }
      # :android (filament-jni-android) builds libfilament-c.so per ABI with upstream's pinned NDK/CMake.
      - name: Install NDK + CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "ndk;29.0.14206865" "cmake;3.22.1" > /dev/null
      - name: Download desktop natives
        uses: actions/download-artifact@v8
        with:
          pattern: c-*
          path: c-artifacts/
          merge-multiple: true
      # Every project with a publication publishes: the kotlin modules, :jni, :android, :web, :desktop and
      # its runtime jars (which take the other platforms' libraries from -PcArtifactsDir).
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVENCENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew \
            -PlibVersion=${{ steps.version.outputs.version }} \
            -PcArtifactsDir=${{ github.workspace }}/c-artifacts \
            publishAllPublicationsToMavenCentralRepository \
            --no-configuration-cache

      # Web apps serve these next to their bundle (klib resources don't reach webpack), so
      # each release carries them as assets; see docs/guide/getting-started.md.
      - name: Build web runtime assets
        run: ./gradlew :web:stageFilamentWasm :web:stageFilamatWasm --no-configuration-cache

      # ── GitHub release ──────────────────────────────────────────────────────
      # Only after Maven Central succeeded, and only for a real tag push — a
      # dispatch run has no tag to hang a release off. Notes are the tag's own
      # CHANGELOG section; a missing section falls back to generated notes
      # rather than publishing an empty release.
      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "$VERSION" --title "$VERSION" --notes-file release-notes.md
          else
            echo "::warning::no CHANGELOG section for $VERSION — using generated notes"
            gh release create "$VERSION" --title "$VERSION" --generate-notes
          fi
          gh release upload "$VERSION" web/build/filamentWasm/* web/build/filamatWasm/*

      # A release created with GITHUB_TOKEN doesn't fire `release: published` in other
      # workflows, so deploy and archive the docs explicitly; workflow_dispatch is exempt.
      - name: Deploy API docs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh workflow run pages.yml --ref "$VERSION" -f archive=true
