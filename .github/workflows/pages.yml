name: Pages

on:
  # PRs build the site (web sample + docs) but never deploy, to catch site-build breaks before
  # they land. Only build config can break it: Dokka doesn't fail on warnings and CI already
  # compiles the web sample, so plain source changes don't run this. No `push` trigger: a main
  # build would be a second copy of the PR's validation, since only releases deploy.
  pull_request:
    branches: [main]
    paths:
      - 'samples/webApp/**'
      - 'samples/gradle/**'
      - 'samples/*.gradle.kts'
      - 'samples/gradle.properties'
      - 'web/build.gradle.kts'
      - 'kotlin/*/build.gradle.kts'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'build-logic/**'
      - '.github/actions/**'
      - '.github/workflows/pages.yml'
  # A published release is the only event that DEPLOYS, and the only one that writes
  # a version into the docs archive — the live site therefore always matches a
  # release, never an in-flight main. publish.yml creates the release once Maven
  # Central accepts.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      archive:
        description: 'Also store these docs in docs-archive as libVersion (run from a release tag)'
        type: boolean
        default: false

# Concurrency: per-ref so PR runs don't cancel a main deploy; within a ref the
# latest run wins.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # The web sample and the API docs are built in separate jobs (the web one needs the wasm
  # toolchain, the docs one macOS). Pages serves a single artifact, so both pieces are merged in
  # `deploy` below.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { java-version: '17', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached
      - uses: ./.github/actions/setup-filament-libs
        with: { targets: wasm }

      - name: Build production webpack bundle
        working-directory: samples
        # jsBrowserDistribution produces the static site under
        # samples/webApp/build/dist/js/productionExecutable/.
        run: ./gradlew :webApp:jsBrowserDistribution --no-configuration-cache

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: samples/webApp/build/dist/js/productionExecutable

  docs:
    # `contents: write` so the docs archive branch can be pushed (see below).
    permissions:
      contents: write
    # macOS: Dokka documents every platform, so it builds each one for its
    # analysis classpath (the iOS klibs need Xcode). iOS native is only buildable on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { java-version: '17', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached

      # Android source sets need the SDK licenses accepted. The iOS C API and its Filament
      # libraries build and download as task dependencies.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      # Previously published versions live as <version>/ dirs on the orphan
      # `docs-archive` branch; Dokka's versioning plugin renders the dropdown from
      # them and re-emits them under api/older/, so one deploy serves every version.
      # Fetched only when this run deploys or archives — it's a ~350 MB clone, a
      # validation build proves as much rendering the current version alone, and the
      # archive push force-pushes this directory, so it must be complete first.
      - name: Restore archived doc versions
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          git clone -q --depth 1 --single-branch --branch docs-archive \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
            build/previousDocs || mkdir -p build/previousDocs
          rm -rf build/previousDocs/.git
          # One docs set per minor line, its newest patch: patches don't change the API, and
          # a version is ~60-80 MB against GitHub Pages' 1 GB site cap. The line being
          # rendered is this version's, so its archived patches go; of the other lines, the
          # seven newest stay (eight with this one). Older releases stay reachable through their git tags.
          version=$(grep '^libVersion=' gradle.properties | cut -d= -f2)
          cd build/previousDocs
          rm -rf "${version%.*}".*
          ls -1 | sort -Vr | awk -F. 'seen[$1"."$2]++ || ++lines > 7' | while read -r stale; do rm -rf "$stale"; done

      - name: Generate API docs
        # Aggregates :kotlin:filament, :kotlin:filamat, :kotlin:filament-utils,
        # :kotlin:gltfio, :kotlin:filament-compose into build/dokka/html (Dokka v2).
        # The native runtimes (:jni, :desktop, :android, :web) are interop plumbing, not documented.
        # The version label comes from libVersion in gradle.properties.
        run: ./gradlew dokkaGenerate --no-configuration-cache

      # Releases only, so a version lands in the archive exactly once, built from its
      # tag; other events generate the docs purely to prove Dokka still works.
      # Force-push a single orphan commit — the branch is a store, not a history, so
      # the repo doesn't grow a copy of the whole site per build.
      - name: Archive this version's docs
        if: github.event_name == 'release' || inputs.archive
        run: |
          version=$(grep '^libVersion=' gradle.properties | cut -d= -f2)
          cp -R build/dokka/html "build/previousDocs/$version"
          rm -rf "build/previousDocs/$version/older"  # don't archive the nested copies
          cd build/previousDocs
          git init -q -b docs-archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "API docs @ $version"
          git push -qf \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
            docs-archive

      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: build/dokka/html

  deploy:
    # PRs are validation builds only — a release (or a manual dispatch, which
    # publishes whatever the chosen ref holds) is what goes live.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: [web, docs]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Web sample at the site root, API docs under /api — one combined artifact.
      - uses: actions/download-artifact@v8
        with: { name: web, path: site }
      - uses: actions/download-artifact@v8
        with: { name: docs, path: site/api }

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v5
