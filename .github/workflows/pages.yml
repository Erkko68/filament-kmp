name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'samples/webApp/**'
      - 'samples/shared/**'
      - 'kotlin/**/src/**'
      - 'web/**'
      - 'prebuilts/web/**'
      - 'gradle/**'
      - 'samples/gradle/**'
      - 'samples/settings.gradle.kts'
      - 'gradle.properties'
      - 'build-logic/**'
      - '.github/workflows/pages.yml'
  # PRs build (web + docs) but never deploy — catches doc-generation breaks
  # before they land on main. Keep paths in sync with `push` above.
  pull_request:
    branches: [main]
    paths:
      - 'samples/webApp/**'
      - 'samples/shared/**'
      - 'kotlin/**/src/**'
      - 'web/**'
      - 'prebuilts/web/**'
      - 'gradle/**'
      - 'samples/gradle/**'
      - 'samples/settings.gradle.kts'
      - 'gradle.properties'
      - 'buildSrc/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Concurrency: per-ref so PR runs don't cancel a main deploy; within a ref the
# latest run wins.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # The web sample and the API docs are built in separate jobs because they need
  # different JDKs (FFM/Panama wants 25, Dokka is incompatible with 25). Pages
  # serves a single artifact, so both pieces are merged in `deploy` below.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached

      - name: Build production webpack bundle
        working-directory: samples
        # jsBrowserDistribution produces the static site under
        # samples/webApp/build/dist/js/productionExecutable/.
        run: ./gradlew :webApp:jsBrowserDistribution --no-configuration-cache

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: samples/webApp/build/dist/js/productionExecutable

  docs:
    # macOS: Dokka documents every platform, so it builds each one for its
    # analysis classpath — iOS cinterop needs Xcode, plus JVM (:java/jextract),
    # JS externals and Android. iOS native is only buildable on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached

      # :java's FFM bindings (jvm source set) are jextract-generated; the C++
      # toolchain (libc++) ships with Xcode on the runner. Android source sets
      # need the SDK licenses accepted. jextract, native and web prebuilts all
      # auto-download as task dependencies.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Generate API docs
        # Aggregates :kotlin:filament, :kotlin:filamat, :kotlin:filament-utils,
        # :kotlin:gltfio, :kotlin:filament-compose into build/dokka/html (Dokka v2).
        # :java and :web modules are excluded (FFM internals / generated externals).
        run: ./gradlew dokkaGenerate --no-configuration-cache

      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: build/dokka/html

  deploy:
    # Build-only on PRs; deploy only from main pushes / manual dispatch.
    if: github.event_name != 'pull_request'
    needs: [web, docs]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Web sample at the site root, API docs under /api — one combined artifact.
      - uses: actions/download-artifact@v8
        with: { name: web, path: site }
      - uses: actions/download-artifact@v8
        with: { name: docs, path: site/api }

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v5
