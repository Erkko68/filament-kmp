name: CI

# One workflow per platform. Each job does setup + the native build ONCE, then runs
# build → test → sample as sequential steps that reuse those outputs (the samples/ build
# is a composite includeBuild of this repo, so its tasks reuse the incremental outputs
# already produced earlier in the same job). Replaces the old build.yml/test.yml/samples.yml,
# which each rebuilt the library from scratch per concern, per platform.
#
# Path-filtered: the `changes` job maps the changed files to platforms (jvm / web / ios / android)
# and only those jobs run; docs-only changes run nothing but `ci-gate`, which still reports, so a PR
# is never stuck without a status. Unrecognized paths run everything. External (fork) PRs are held
# until a maintainer clicks "Approve and run" (Settings → Actions → General). `workflow_dispatch`
# runs one platform, or all of them, from the Actions tab.
#
# Pushes to main run the same filtered jobs. Besides post-merge signal, that is what makes caches
# work: a PR can only restore caches saved by its own ref or by main, so main has to save them.
#
# `ci-gate` is the single required status check: on PRs it fails unless every selected job succeeded.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Which platform job(s) to run'
        type: choice
        default: all
        options: [all, jvm, web, ios, android]

# Cancel superseded runs for the same ref (a new push to a PR supersedes the old one).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      jvm: ${{ steps.filter.outputs.jvm }}
      web: ${{ steps.filter.outputs.web }}
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: .github/scripts }
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          ONLY: ${{ inputs.jobs }}
        run: .github/scripts/ci-changes.sh >> "$GITHUB_OUTPUT"

  jvm:
    needs: changes
    if: needs.changes.outputs.jvm == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macosArm64
          - os: ubuntu-latest
            target: linuxX64
          - os: ubuntu-24.04-arm
            target: linuxArm64
          - os: windows-latest
            target: mingwX64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { java-version: '25', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached
      - name: Install C++ deps (Linux)
        if: runner.os == 'Linux'
        # ports.ubuntu.com (the ARM runners' only mirror) intermittently drops
        # connections — refresh the lists and retry before giving up.
        run: |
          for i in 1 2 3; do
            sudo apt-get update
            sudo apt-get install -y clang libc++-dev libc++abi-dev libgl-dev libegl1 && exit 0
            echo "apt attempt $i failed; retrying in 20s" && sleep 20
          done
          exit 1
      - name: Read Filament version
        id: ver
        shell: bash
        run: echo "v=$(grep '^filaVersion=' gradle.properties | cut -d= -f2)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: prebuilts/${{ matrix.target }}
          # The mingw CRT variant (mt/md) is part of the key: switching it must
          # invalidate the cache, else the gradle task skips re-extraction (it only
          # checks the dir is non-empty) and links a mismatched CRT.
          key: filament-prebuilts-${{ steps.ver.outputs.v }}-${{ matrix.target }}${{ matrix.target == 'mingwX64' && '-mt' || '' }}
      - name: Download prebuilts
        shell: bash
        run: ./gradlew downloadPrebuilts_${{ matrix.target }}
      - name: Build library
        shell: bash
        run: ./gradlew compileKotlinJvm --no-configuration-cache
      # Public-API surface guard: fails if the JVM ABI of any published :kotlin:*
      # module drifts from the committed api/ dumps (regenerate with `apiDump`).
      - name: API compatibility check
        shell: bash
        run: ./gradlew apiCheck --no-configuration-cache
      - name: Run JVM tests
        shell: bash
        run: |
          ./gradlew \
            :java:test \
            :kotlin:filament:jvmTest \
            :kotlin:filamat:jvmTest \
            :kotlin:filament-utils:jvmTest \
            :kotlin:gltfio:jvmTest \
            :kotlin:filament-compose:jvmTest \
            --no-configuration-cache
      # Aggregate JVM test coverage once, on the macOS runner where the real-backend (Metal)
      # tests also run, for the highest-coverage snapshot. Report-only (non-blocking) — no
      # threshold is enforced. js/native actuals run on runtimes Kover can't instrument.
      - name: Coverage report
        if: matrix.target == 'macosArm64'
        shell: bash
        run: ./gradlew koverXmlReport koverHtmlReport --no-configuration-cache
      - name: Upload coverage report
        if: matrix.target == 'macosArm64'
        uses: actions/upload-artifact@v7
        with:
          name: kover-coverage
          path: build/reports/kover/
      - name: Build desktop sample
        working-directory: samples
        shell: bash
        run: ./gradlew :desktopApp:compileKotlinJvm --no-configuration-cache
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports-${{ matrix.target }}
          path: kotlin/*/build/reports/tests/

  # The emsdk half of the web targets, done once: builds filament-kmp/filamat-kmp .{js,wasm}
  # (c/ compiled with emcc) and hands them to the js and wasm jobs as an artifact.
  web-runtime:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { java-version: '25', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached
      - uses: ./.github/actions/setup-wasm
      - name: Generated wasm externals are up to date
        # Committed so compiling needs no emsdk; a C header change must come with a regen.
        run: |
          ./gradlew :web:generateWasmExternals :kotlin:filamat:generateFilamatExternals --no-configuration-cache
          git diff --exit-code -- web/src kotlin/filamat/src
      - name: Build wasm runtime
        run: ./gradlew :web:buildFilamentWasm --no-configuration-cache
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-runtime
          path: |
            c/build/wasm/*-kmp.js
            c/build/wasm/*-kmp.wasm
          if-no-files-found: error
          retention-days: 1

  js:
    needs: web-runtime
    runs-on: ubuntu-latest
    env:
      FILA_WASM_PREBUILT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { java-version: '25', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached
      - uses: actions/download-artifact@v8
        with: { name: wasm-runtime, path: c/build/wasm }
      - name: Build library
        run: ./gradlew compileKotlinJs --no-configuration-cache
      - name: Run JS tests
        run: |
          ./gradlew \
            :kotlin:filament:jsTest \
            :kotlin:filamat:jsTest \
            :kotlin:filament-utils:jsTest \
            :kotlin:gltfio:jsTest \
            :kotlin:filament-compose:jsTest \
            :web:jsTest \
            --no-configuration-cache
      - name: Build web sample
        working-directory: samples
        run: ./gradlew :webApp:compileKotlinJs --no-configuration-cache
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: js-test-reports
          path: kotlin/*/build/reports/tests/

  # wasmJs shares the webMain actuals with js but runs a different compiler backend and
  # browser runtime, so it gets its own job (distinct signal, runs in parallel with js).
  wasm:
    needs: web-runtime
    runs-on: ubuntu-latest
    env:
      FILA_WASM_PREBUILT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { java-version: '25', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached
      - uses: actions/download-artifact@v8
        with: { name: wasm-runtime, path: c/build/wasm }
      - name: Build library
        run: ./gradlew compileKotlinWasmJs --no-configuration-cache
      - name: Run Wasm tests
        run: |
          ./gradlew \
            :kotlin:filament:wasmJsTest \
            :kotlin:filamat:wasmJsTest \
            :kotlin:filament-utils:wasmJsTest \
            :kotlin:gltfio:wasmJsTest \
            :kotlin:filament-compose:wasmJsTest \
            :web:wasmJsTest \
            --no-configuration-cache
      - name: Build web sample
        working-directory: samples
        run: ./gradlew :webApp:compileKotlinWasmJs --no-configuration-cache
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-test-reports
          path: kotlin/*/build/reports/tests/

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      # Real-backend (Metal) tests need a booted simulator with a graphics context (K/N's
      # default --standalone mode has none). Boot now; it comes up while the library builds.
      - name: Boot iOS simulator
        id: sim
        run: |
          DEV="$(xcrun simctl list devices available | grep -oE 'iPhone[^(]*' | head -1 | sed 's/ *$//')"
          echo "Booting simulator: $DEV"
          xcrun simctl boot "$DEV" || true
          echo "device=$DEV" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with: { java-version: '25', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached
      - name: Read Filament version
        id: ver
        run: echo "v=$(grep '^filaVersion=' gradle.properties | cut -d= -f2)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: |
            prebuilts/iosArm64
            prebuilts/iosSimulatorArm64
          key: filament-prebuilts-${{ steps.ver.outputs.v }}-ios
      - name: Download prebuilts
        run: ./gradlew downloadPrebuilts_iosArm64 downloadPrebuilts_iosSimulatorArm64
      - name: Build library
        run: |
          ./gradlew \
            compileKotlinIosArm64 \
            compileKotlinIosSimulatorArm64 \
            --no-configuration-cache
      - name: Run iOS simulator tests
        run: |
          xcrun simctl bootstatus "${{ steps.sim.outputs.device }}" -b || true
          ./gradlew \
            :kotlin:filament:iosSimulatorArm64Test \
            :kotlin:filamat:iosSimulatorArm64Test \
            :kotlin:filament-utils:iosSimulatorArm64Test \
            :kotlin:gltfio:iosSimulatorArm64Test \
            :kotlin:filament-compose:iosSimulatorArm64Test \
            "-PiosSimulatorDevice=${{ steps.sim.outputs.device }}" \
            --no-configuration-cache
      - name: Assemble XCFrameworks
        # Release-mode K/N linking of 5 modules × 2 arches is ~18 min and only verifies the
        # distribution artifacts link — which publish.yml needs, not per-PR correctness (the
        # sim tests + sample xcodebuild already prove iOS builds & runs). Skip on PRs; still
        # runs on push to main and manual dispatch.
        if: github.event_name != 'pull_request'
        run: |
          ./gradlew \
            assembleFilamentXCFramework \
            assembleFilamatXCFramework \
            assembleFilamentUtilsXCFramework \
            assembleGltfioXCFramework \
            assembleFilamentComposeXCFramework \
            --no-configuration-cache
      - name: Build iOS sample (Simulator)
        working-directory: samples/iosApp
        run: |
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          path: kotlin/*/build/reports/tests/

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { java-version: '25', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
      - name: Build library
        run: ./gradlew compileAndroidMain --no-configuration-cache
      - name: Enable KVM (for android emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Cache the AVD + a warmed boot snapshot so the test run boots from a
      # snapshot instead of cold-booting every time — faster and far less flaky
      # for Filament's GPU driver, which is sensitive to first-boot timing.
      # 2+ GB with a fixed key: only main saves it, PRs restore main's copy.
      - name: AVD cache
        uses: actions/cache/restore@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-load
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - if: steps.avd-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :kotlin:filament:connectedAndroidDeviceTest :kotlin:filamat:connectedAndroidDeviceTest :kotlin:filament-utils:connectedAndroidDeviceTest :kotlin:gltfio:connectedAndroidDeviceTest :kotlin:filament-compose:connectedAndroidDeviceTest --no-configuration-cache
      - name: Build Android sample
        run: ./gradlew :androidApp:assembleDebug --no-configuration-cache
        working-directory: samples
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: kotlin/*/build/reports/androidTests/

  # Single required status check for branch protection. Jobs the path filter skipped count as
  # passing; a failed or cancelled job (or a failed filter) fails it.
  ci-gate:
    if: always()
    needs: [changes, jvm, web-runtime, js, wasm, ios, android]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Results = ${{ join(needs.*.result, ' ') }}"
      - if: >-
          needs.changes.result != 'success' ||
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
