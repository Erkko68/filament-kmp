name: CI

# One workflow per platform. Each job does setup + the native build ONCE, then runs
# build → test → sample as sequential steps that reuse those outputs (the samples/ build
# is a composite includeBuild of this repo, so its tasks reuse the incremental outputs
# already produced earlier in the same job). Replaces the old build.yml/test.yml/samples.yml,
# which each rebuilt the library from scratch per concern, per platform.
#
# The full platform matrix runs automatically on every PR and on push to main. The matrix is
# EXPENSIVE (native prebuilts, emulators, XCFrameworks), so external (fork) PRs are held until a
# maintainer clicks "Approve and run" — GitHub's native fork-PR approval setting (Settings →
# Actions → General), not anything in this file. Collaborators' PRs run with no approval step.
# `workflow_dispatch` still lets you run a single platform manually from the Actions tab.
#
# `ci-gate` is the single required status check: it fails unless every platform job SUCCEEDED,
# so a PR can't be merged until the matrix is green.

on:
  push:
    branches: [main]
    # Docs-only changes don't affect the build — skip the (expensive) matrix.
    paths-ignore: ['**.md']
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Which platform job(s) to run'
        type: choice
        default: all
        options: [all, jvm, js, ios, android]

# Cancel superseded runs for the same ref (a new push to a PR supersedes the old one).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    # Run on: push to main; any PR; manual dispatch (all|jvm).
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.jobs == 'all' || inputs.jobs == 'jvm'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macosArm64
          - os: ubuntu-latest
            target: linuxX64
          - os: ubuntu-24.04-arm
            target: linuxArm64
          - os: windows-latest
            target: mingwX64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - uses: ./.github/actions/setup-gradle-cached
      - name: Install C++ deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y clang libc++-dev libc++abi-dev libgl-dev
      - name: Read Filament version
        id: ver
        shell: bash
        run: echo "v=$(grep '^filaVersion=' gradle.properties | cut -d= -f2)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: prebuilts/${{ matrix.target }}
          key: filament-prebuilts-${{ steps.ver.outputs.v }}-${{ matrix.target }}
      - name: Download prebuilts
        shell: bash
        run: ./gradlew downloadPrebuilts_${{ matrix.target }}
      - name: Install jextract
        shell: bash
        run: python3 scripts/gradle/download_jextract.py
      - name: Build library
        shell: bash
        run: ./gradlew compileKotlinJvm --no-configuration-cache
      - name: Run JVM tests
        shell: bash
        run: |
          ./gradlew \
            :kotlin:filament:jvmTest \
            :kotlin:filamat:jvmTest \
            :kotlin:filament-utils:jvmTest \
            :kotlin:gltfio:jvmTest \
            --no-configuration-cache
      - name: Build desktop sample
        working-directory: samples
        shell: bash
        run: ./gradlew :desktopApp:compileKotlinJvm --no-configuration-cache
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports-${{ matrix.target }}
          path: kotlin/*/build/reports/tests/

  js:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.jobs == 'all' || inputs.jobs == 'js'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached
      - name: Build library
        run: ./gradlew compileKotlinJs --no-configuration-cache
      - name: Run JS tests
        run: |
          ./gradlew \
            :kotlin:filament:jsTest \
            :kotlin:filamat:jsTest \
            :kotlin:filament-utils:jsTest \
            :kotlin:gltfio:jsTest \
            --no-configuration-cache
      - name: Build web sample
        working-directory: samples
        run: ./gradlew :webApp:compileKotlinJs --no-configuration-cache
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: js-test-reports
          path: kotlin/*/build/reports/tests/

  ios:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.jobs == 'all' || inputs.jobs == 'ios'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - uses: ./.github/actions/setup-gradle-cached
      - name: Read Filament version
        id: ver
        run: echo "v=$(grep '^filaVersion=' gradle.properties | cut -d= -f2)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: |
            prebuilts/iosArm64
            prebuilts/iosSimulatorArm64
          key: filament-prebuilts-${{ steps.ver.outputs.v }}-ios
      - name: Download prebuilts
        run: ./gradlew downloadPrebuilts_iosArm64 downloadPrebuilts_iosSimulatorArm64
      - name: Build library
        run: |
          ./gradlew \
            compileKotlinIosArm64 \
            compileKotlinIosSimulatorArm64 \
            --no-configuration-cache
      - name: Boot iOS simulator
        id: sim
        run: |
          # Real-backend (Metal) tests need a booted simulator with a graphics
          # context; Kotlin/Native's default --standalone mode has none.
          DEV="$(xcrun simctl list devices available | grep -oE 'iPhone[^(]*' | head -1 | sed 's/ *$//')"
          echo "Booting simulator: $DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b || true
          echo "device=$DEV" >> "$GITHUB_OUTPUT"
      - name: Run iOS simulator tests
        run: |
          ./gradlew \
            :kotlin:filament:iosSimulatorArm64Test \
            :kotlin:filamat:iosSimulatorArm64Test \
            :kotlin:filament-utils:iosSimulatorArm64Test \
            :kotlin:gltfio:iosSimulatorArm64Test \
            "-PiosSimulatorDevice=${{ steps.sim.outputs.device }}" \
            --no-configuration-cache
      - name: Assemble XCFrameworks
        run: |
          ./gradlew \
            assembleFilamentXCFramework \
            assembleFilamatXCFramework \
            assembleFilamentUtilsXCFramework \
            assembleGltfioXCFramework \
            assembleFilamentComposeXCFramework \
            --no-configuration-cache
      - name: Build iOS sample (Simulator)
        working-directory: samples/iosApp
        run: |
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: kotlin/*/build/reports/tests/

  android:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.jobs == 'all' || inputs.jobs == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
      - name: Build library
        run: ./gradlew compileReleaseKotlinAndroid --no-configuration-cache
      - name: Enable KVM (for android emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: ./gradlew :kotlin:filament:connectedDebugAndroidTest :kotlin:filamat:connectedDebugAndroidTest :kotlin:filament-utils:connectedDebugAndroidTest :kotlin:gltfio:connectedDebugAndroidTest --no-configuration-cache
      - name: Build Android sample
        run: ./gradlew :androidApp:assembleDebug --no-configuration-cache
        working-directory: samples
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: kotlin/*/build/reports/androidTests/

  # Single required status check for branch protection. Runs always and fails unless EVERY
  # platform job succeeded, so a PR can't merge until the matrix is green. Manual dispatches
  # that intentionally run a subset don't fail the gate (they're not gating a merge).
  ci-gate:
    if: always()
    needs: [jvm, js, ios, android]
    runs-on: ubuntu-latest
    steps:
      - name: Require all platform jobs to have succeeded
        if: github.event_name != 'workflow_dispatch'
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Platform job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::CI gate failed (a platform job result was '$r'). Ensure jvm/js/ios/android all pass before merging."
              exit 1
            fi
          done
          echo "All platform jobs succeeded — gate green."
      - name: Manual dispatch summary
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual dispatch (jobs=${{ inputs.jobs }}); gate not enforced for dispatch runs."
