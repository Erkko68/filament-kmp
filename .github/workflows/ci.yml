name: CI

# One workflow per platform. Each job does setup + the native build ONCE, then runs
# build → test → sample as sequential steps that reuse those outputs (the samples/ build
# is a composite includeBuild of this repo, so its tasks reuse the incremental outputs
# already produced earlier in the same job). Replaces the old build.yml/test.yml/samples.yml,
# which each rebuilt the library from scratch per concern, per platform.
#
# The full platform matrix runs on EVERY PR and on push to main — no path filters (mirrors
# google/filament's always-run presubmit). This means even a docs-only PR runs the matrix, so the
# required `ci-gate` check always reports and a PR can never be stuck with no status. External
# (fork) PRs are held until a maintainer clicks "Approve and run" — GitHub's native fork-PR approval
# setting (Settings → Actions → General), not anything in this file. `workflow_dispatch` runs a
# single platform manually from the Actions tab.
#
# To avoid re-running the matrix on `main` for a commit that already passed as a PR, `check-verification`
# skips the platform jobs on pushes to `main` whose commit is GitHub-verified (the signed merge commit
# a UI merge produces). Direct/unverified pushes to `main` still run.
#
# `ci-gate` is the single required status check (enforced on PRs): it fails unless every platform job
# SUCCEEDED, so a PR can't be merged until the matrix is green.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Which platform job(s) to run'
        type: choice
        default: all
        options: [all, jvm, js, wasm, ios, android]

# Cancel superseded runs for the same ref (a new push to a PR supersedes the old one).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the platform matrix should run. Always runs for PRs and manual dispatch; on a
  # push to main it skips the matrix when the commit is GitHub-verified (a UI merge of a PR that
  # already passed CI). Direct/unverified pushes to main still run.
  check-verification:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          verified=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}" -q '.commit.verification.verified')
          if [ "$verified" = "true" ]; then
            echo "Commit is GitHub-verified (already passed as a PR) — skipping the matrix on main."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Commit is not verified — running the matrix."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  jvm:
    needs: check-verification
    # Run when verification says so, AND (any non-dispatch event, or a dispatch selecting all|jvm).
    if: >-
      needs.check-verification.outputs.run == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'jvm')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macosArm64
          - os: ubuntu-latest
            target: linuxX64
          - os: ubuntu-24.04-arm
            target: linuxArm64
          - os: windows-latest
            target: mingwX64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached
      - name: Install C++ deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y clang libc++-dev libc++abi-dev libgl-dev libegl1
      - name: Read Filament version
        id: ver
        shell: bash
        run: echo "v=$(grep '^filaVersion=' gradle.properties | cut -d= -f2)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: prebuilts/${{ matrix.target }}
          # The mingw CRT variant (mt/md) is part of the key: switching it must
          # invalidate the cache, else the gradle task skips re-extraction (it only
          # checks the dir is non-empty) and links a mismatched CRT.
          key: filament-prebuilts-${{ steps.ver.outputs.v }}-${{ matrix.target }}${{ matrix.target == 'mingwX64' && '-mt' || '' }}
      - name: Download prebuilts
        shell: bash
        run: ./gradlew downloadPrebuilts_${{ matrix.target }}
      - name: Build library
        shell: bash
        run: ./gradlew compileKotlinJvm --no-configuration-cache
      # Public-API surface guard: fails if the JVM ABI of any published :kotlin:*
      # module drifts from the committed api/ dumps (regenerate with `apiDump`).
      - name: API compatibility check
        shell: bash
        run: ./gradlew apiCheck --no-configuration-cache
      - name: Run JVM tests
        shell: bash
        run: |
          ./gradlew \
            :java:test \
            :kotlin:filament:jvmTest \
            :kotlin:filamat:jvmTest \
            :kotlin:filament-utils:jvmTest \
            :kotlin:gltfio:jvmTest \
            :kotlin:filament-compose:jvmTest \
            --no-configuration-cache
      # Aggregate JVM test coverage once, on the macOS runner where the real-backend (Metal)
      # tests also run, for the highest-coverage snapshot. Report-only (non-blocking) — no
      # threshold is enforced. js/native actuals run on runtimes Kover can't instrument.
      - name: Coverage report
        if: matrix.target == 'macosArm64'
        shell: bash
        run: ./gradlew koverXmlReport koverHtmlReport --no-configuration-cache
      - name: Upload coverage report
        if: matrix.target == 'macosArm64'
        uses: actions/upload-artifact@v7
        with:
          name: kover-coverage
          path: build/reports/kover/
      - name: Build desktop sample
        working-directory: samples
        shell: bash
        run: ./gradlew :desktopApp:compileKotlinJvm --no-configuration-cache
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports-${{ matrix.target }}
          path: kotlin/*/build/reports/tests/

  js:
    needs: check-verification
    if: >-
      needs.check-verification.outputs.run == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'js')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached
      - name: Build library
        run: ./gradlew compileKotlinJs --no-configuration-cache
      - name: Run JS tests
        run: |
          ./gradlew \
            :kotlin:filament:jsTest \
            :kotlin:filamat:jsTest \
            :kotlin:filament-utils:jsTest \
            :kotlin:gltfio:jsTest \
            :kotlin:filament-compose:jsTest \
            --no-configuration-cache
      - name: Build web sample
        working-directory: samples
        run: ./gradlew :webApp:compileKotlinJs --no-configuration-cache
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: js-test-reports
          path: kotlin/*/build/reports/tests/

  # wasmJs shares the webMain actuals with js but runs a different compiler backend and
  # browser runtime, so it gets its own job (distinct signal, runs in parallel with js).
  wasm:
    needs: check-verification
    if: >-
      needs.check-verification.outputs.run == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'wasm')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached
      - name: Build library
        run: ./gradlew compileKotlinWasmJs --no-configuration-cache
      - name: Run Wasm tests
        run: |
          ./gradlew \
            :kotlin:filament:wasmJsTest \
            :kotlin:filamat:wasmJsTest \
            :kotlin:filament-utils:wasmJsTest \
            :kotlin:gltfio:wasmJsTest \
            :kotlin:filament-compose:wasmJsTest \
            --no-configuration-cache
      - name: Build web sample
        working-directory: samples
        run: ./gradlew :webApp:compileKotlinWasmJs --no-configuration-cache
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-test-reports
          path: kotlin/*/build/reports/tests/

  ios:
    needs: check-verification
    if: >-
      needs.check-verification.outputs.run == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'ios')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached
      - name: Read Filament version
        id: ver
        run: echo "v=$(grep '^filaVersion=' gradle.properties | cut -d= -f2)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: |
            prebuilts/iosArm64
            prebuilts/iosSimulatorArm64
          key: filament-prebuilts-${{ steps.ver.outputs.v }}-ios
      - name: Download prebuilts
        run: ./gradlew downloadPrebuilts_iosArm64 downloadPrebuilts_iosSimulatorArm64
      - name: Build library
        run: |
          ./gradlew \
            compileKotlinIosArm64 \
            compileKotlinIosSimulatorArm64 \
            --no-configuration-cache
      - name: Boot iOS simulator
        id: sim
        run: |
          # Real-backend (Metal) tests need a booted simulator with a graphics
          # context; Kotlin/Native's default --standalone mode has none.
          DEV="$(xcrun simctl list devices available | grep -oE 'iPhone[^(]*' | head -1 | sed 's/ *$//')"
          echo "Booting simulator: $DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b || true
          echo "device=$DEV" >> "$GITHUB_OUTPUT"
      - name: Run iOS simulator tests
        run: |
          ./gradlew \
            :kotlin:filament:iosSimulatorArm64Test \
            :kotlin:filamat:iosSimulatorArm64Test \
            :kotlin:filament-utils:iosSimulatorArm64Test \
            :kotlin:gltfio:iosSimulatorArm64Test \
            :kotlin:filament-compose:iosSimulatorArm64Test \
            "-PiosSimulatorDevice=${{ steps.sim.outputs.device }}" \
            --no-configuration-cache
      - name: Assemble XCFrameworks
        # Release-mode K/N linking of 5 modules × 2 arches is ~18 min and only verifies the
        # distribution artifacts link — which publish.yml needs, not per-PR correctness (the
        # sim tests + sample xcodebuild already prove iOS builds & runs). Skip on PRs; still
        # runs on push to main and manual dispatch.
        if: github.event_name != 'pull_request'
        run: |
          ./gradlew \
            assembleFilamentXCFramework \
            assembleFilamatXCFramework \
            assembleFilamentUtilsXCFramework \
            assembleGltfioXCFramework \
            assembleFilamentComposeXCFramework \
            --no-configuration-cache
      - name: Build iOS sample (Simulator)
        working-directory: samples/iosApp
        run: |
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          path: kotlin/*/build/reports/tests/

  android:
    needs: check-verification
    if: >-
      needs.check-verification.outputs.run == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'android')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
      - name: Build library
        run: ./gradlew compileAndroidMain --no-configuration-cache
      - name: Enable KVM (for android emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Cache the AVD + a warmed boot snapshot so the test run boots from a
      # snapshot instead of cold-booting every time — faster and far less flaky
      # for Filament's GPU driver, which is sensitive to first-boot timing.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-load
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :kotlin:filament:connectedAndroidDeviceTest :kotlin:filamat:connectedAndroidDeviceTest :kotlin:filament-utils:connectedAndroidDeviceTest :kotlin:gltfio:connectedAndroidDeviceTest :kotlin:filament-compose:connectedAndroidDeviceTest --no-configuration-cache
      - name: Build Android sample
        run: ./gradlew :androidApp:assembleDebug --no-configuration-cache
        working-directory: samples
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: kotlin/*/build/reports/androidTests/

  # Single required status check for branch protection. Enforced on PRs only — it fails unless
  # every platform job succeeded, so a PR can't merge until the matrix is green. On push to main
  # (where jobs may be intentionally skipped by check-verification) and on manual dispatch it only
  # summarizes, so skipped jobs never fail the gate.
  ci-gate:
    if: always()
    needs: [jvm, js, wasm, ios, android]
    runs-on: ubuntu-latest
    steps:
      - name: Require all platform jobs to have succeeded
        if: github.event_name == 'pull_request'
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Platform job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::CI gate failed (a platform job result was '$r'). Ensure jvm/js/wasm/ios/android all pass before merging."
              exit 1
            fi
          done
          echo "All platform jobs succeeded — gate green."
      - name: Summary (push / dispatch)
        if: github.event_name != 'pull_request'
        run: |
          echo "Event '${{ github.event_name }}' — gate not enforced. Platform results = ${{ join(needs.*.result, ' ') }}"
