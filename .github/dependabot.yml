version: 2
updates:
  # Root + samples in one entry: samples includeBuild("../"), so AGP/Kotlin/Compose must move
  # together — a group spanning both directories lands as one PR instead of a split that breaks.
  - package-ecosystem: "gradle"
    directories:
      - "/"
      - "/samples"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Our own artifacts (samples' standalone fallback); substituted by includeBuild, bumped at release.
      - dependency-name: "io.github.erkko68.filament*"
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      compose:
        patterns:
          - "org.jetbrains.compose*"
          # Tracks composeMultiplatform (see androidx-composeUi in libs.versions.toml).
          - "androidx.compose*"
      android:
        patterns:
          - "com.android*"
          - "androidx.*"
      # Catch-all (incl. the Gradle wrapper). A dependency joins the first matching
      # group, so the named groups above claim theirs and this sweeps the rest into
      # one PR instead of one-per-dependency.
      gradle:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
